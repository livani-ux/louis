<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Caixa</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--sf:#fff;--ink:#10202e;--mu:#5b6b79;--ln:#cbd5dd;--ac:#0b6e4f;--in:#0b8a5b;--out:#c8453b;--loan:#b7791f;--biz:#3d5afe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--sf:#16222f;--ink:#e8eef3;--mu:#93a3b2;--ln:#27384a;--ac:#3fc79a;--in:#3fc79a;--out:#ff7a6e;--loan:#e8b04a;--biz:#8fa0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1620;--sf:#16222f;--ink:#e8eef3;--mu:#93a3b2;--ln:#27384a;--ac:#3fc79a;--in:#3fc79a;--out:#ff7a6e;--loan:#e8b04a;--biz:#8fa0ff;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:17px;margin:26px 0 10px;font-weight:600}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-width:0}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:9px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
:root[data-theme="dark"] button.p{color:#06281d}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{display:flex;gap:6px;margin:16px 0;overflow-x:auto}
nav button{border-radius:99px;white-space:nowrap}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:13px;color:var(--mu)}
.v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1 1 120px}
.flow{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--ln)}
.flow i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mu)}
.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0}
.tag{font-size:12px;color:var(--mu)}
.x{border:0;background:none;color:var(--mu);padding:4px 8px}
.in{color:var(--in)}.out{color:var(--out)}.loan{color:var(--loan)}.biz{color:var(--biz)}
.late{color:var(--out);font-weight:600}
.done span{text-decoration:line-through;color:var(--mu)}
.empty{color:var(--mu);padding:8px 0}
</style>
</head>
<body>
<main>
<header>
  <h1>Meu Caixa</h1>
  <input type="month" id="mes" aria-label="Mês" onchange="mes=this.value;render()">
</header>
<nav>
  <button data-t="resumo" onclick="go('resumo')">Resumo</button>
  <button data-t="lanc" onclick="go('lanc')">Lançamentos</button>
  <button data-t="metas" onclick="go('metas')">Metas</button>
  <button data-t="lemb" onclick="go('lemb')">Lembretes</button>
</nav>
<div id="v"></div>
</main>
<script>
const K='meucaixa.v1';
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
S=S||{tx:[],metas:[],lembs:[],emp:['Pessoal','Revenda','Placas NFC','Lanchonete SaaS','Eventos']};
let tab='resumo',mes=hoje().slice(0,7);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now()+Math.random();
const T={in:'Recebi',out:'Gastei',loan:'Emprestei',biz:'Pus no negócio'};
const CATS=['Comida','Lazer','Transporte','Casa','Saúde','Outros'];
const opt=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
const fd=d=>d.split('-').reverse().join('/');
function go(t){tab=t;render()}

function resumo(){
  const m=S.tx.filter(t=>t.d.startsWith(mes));
  const s=k=>m.filter(t=>t.t===k).reduce((a,t)=>a+t.v,0);
  const rin=s('in'),out=s('out'),loan=s('loan'),biz=s('biz'),saldo=rin-out-loan-biz;
  const tot=Math.max(rin,out+loan+biz)||1;
  const w=v=>(v/tot*100).toFixed(1)+'%';
  const sobra=Math.max(saldo,0);
  const cats={};m.filter(t=>t.t==='out').forEach(t=>cats[t.c]=(cats[t.c]||0)+t.v);
  const cmax=Math.max(...Object.values(cats),1);
  const emps=S.emp.map(e=>{const x=m.filter(t=>t.e===e);return{e,in:x.filter(t=>t.t==='in').reduce((a,t)=>a+t.v,0),out:x.filter(t=>t.t==='out'||t.t==='biz').reduce((a,t)=>a+t.v,0)}}).filter(x=>x.in||x.out);
  return `<div class="box"><div class="k">Sobrou no mês</div><div class="v ${saldo<0?'out':'in'}" style="font-size:34px">${brl(saldo)}</div>
  <h2 style="margin-top:14px">Pra onde foi o dinheiro</h2>
  <div class="flow" role="img" aria-label="Distribuição do dinheiro no mês"><i style="width:${w(out)};background:var(--out)"></i><i style="width:${w(loan)};background:var(--loan)"></i><i style="width:${w(biz)};background:var(--biz)"></i><i style="width:${w(sobra)};background:var(--in)"></i></div>
  <div class="leg"><span><b style="background:var(--out)"></b>Gastei</span><span><b style="background:var(--loan)"></b>Emprestei</span><span><b style="background:var(--biz)"></b>Negócio</span><span><b style="background:var(--in)"></b>Sobrou</span></div></div>
  <div class="grid" style="margin-top:10px">
  <div class="box"><div class="k">Recebi</div><div class="v in">${brl(rin)}</div></div>
  <div class="box"><div class="k">Gastei</div><div class="v out">${brl(out)}</div></div>
  <div class="box"><div class="k">Emprestei</div><div class="v loan">${brl(loan)}</div></div>
  <div class="box"><div class="k">Pus no negócio</div><div class="v biz">${brl(biz)}</div></div></div>
  <h2>Gastos por categoria</h2><div class="box">${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin-bottom:10px"><div class="li" style="padding:0;border:0"><span>${esc(c)}</span><b>${brl(v)}</b></div><div class="bar"><i style="width:${v/cmax*100}%;background:var(--out)"></i></div></div>`).join(''):'<div class="empty">Nenhum gasto neste mês.</div>'}</div>
  <h2>Por empreendimento</h2><div class="box">${emps.length?emps.map(x=>`<div class="li"><span>${esc(x.e)}</span><span class="tag">entrou <b class="in">${brl(x.in)}</b> · saiu <b class="out">${brl(x.out)}</b> · lucro <b>${brl(x.in-x.out)}</b></span></div>`).join(''):'<div class="empty">Lance algo com um empreendimento para ver aqui.</div>'}</div>`;
}

function lanc(){
  const m=S.tx.filter(t=>t.d.startsWith(mes)).sort((a,b)=>b.d.localeCompare(a.d));
  return `<div class="box"><div class="row">
  <select id="ft" onchange="$('#fc').style.display=this.value==='out'?'':'none'">${Object.entries(T).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
  <input id="fv" type="number" step="0.01" min="0" placeholder="Valor (R$)" inputmode="decimal"></div>
  <div class="row"><input id="fd" placeholder="Descrição" style="flex:2 1 200px">
  <select id="fc" style="display:none">${opt(CATS)}</select>
  <select id="fe" aria-label="Empreendimento">${opt(S.emp)}</select>
  <input id="fdt" type="date" value="${hoje()}"></div>
  <button class="p" onclick="addTx()">Adicionar</button></div>
  <h2>Empreendimentos</h2><div class="box"><div class="row" style="margin:0">
  <input id="ne" placeholder="Novo empreendimento"><button onclick="addEmp()">Criar</button></div>
  <div class="tag" style="margin-top:8px">${S.emp.map(esc).join(' · ')}</div></div>
  <h2>Movimentações do mês</h2><div class="box">${m.length?m.map(t=>`<div class="li"><div><div>${esc(t.n||T[t.t])}</div><div class="tag">${fd(t.d)} · ${esc(t.e)}${t.t==='out'?' · '+esc(t.c):''}</div></div><div><b class="${t.t}">${t.t==='in'?'+':'−'}${brl(t.v)}</b><button class="x" aria-label="Apagar" onclick="del('tx',${t.id})">✕</button></div></div>`).join(''):'<div class="empty">Sem lançamentos neste mês.</div>'}</div>`;
}
function addTx(){
  const v=parseFloat($('#fv').value);if(!(v>0)){$('#fv').focus();return}
  S.tx.push({id:id(),t:$('#ft').value,v,n:$('#fd').value.trim(),c:$('#fc').value,e:$('#fe').value,d:$('#fdt').value||hoje()});
  save();render()}
function addEmp(){const n=$('#ne').value.trim();if(n&&!S.emp.includes(n)){S.emp.push(n);save();render()}}

function metas(){
  return `<div class="box"><div class="row"><input id="mn" placeholder="Meta (ex.: reserva de emergência)" style="flex:2 1 200px"><input id="ma" type="number" min="1" step="0.01" placeholder="Valor alvo (R$)"></div><button class="p" onclick="addMeta()">Criar meta</button></div>
  <h2>Minhas metas</h2>${S.metas.length?S.metas.map(g=>{const p=Math.min(100,g.cur/g.alvo*100);return `<div class="box" style="margin-bottom:10px"><div class="li" style="padding:0;border:0"><b>${esc(g.n)}</b><button class="x" aria-label="Apagar meta" onclick="del('metas',${g.id})">✕</button></div>
  <div class="tag">${brl(g.cur)} de ${brl(g.alvo)} · ${p.toFixed(0)}%${p>=100?' · meta batida':''}</div><div class="bar"><i style="width:${p}%"></i></div>
  <div class="row" style="margin:10px 0 0"><input id="g${g.id}" type="number" step="0.01" placeholder="Guardar (R$)"><button onclick="addGuard(${g.id})">Somar</button></div></div>`}).join(''):'<div class="empty">Crie sua primeira meta acima.</div>'}`;
}
function addMeta(){const n=$('#mn').value.trim(),a=parseFloat($('#ma').value);if(!n||!(a>0))return;S.metas.push({id:id(),n,alvo:a,cur:0});save();render()}
function addGuard(i){const g=S.metas.find(x=>x.id===i),v=parseFloat($('#g'+i).value);if(g&&v){g.cur=Math.max(0,g.cur+v);save();render()}}

function lemb(){
  const l=[...S.lembs].sort((a,b)=>(a.ok-b.ok)||(a.d||'9').localeCompare(b.d||'9'));
  return `<div class="box"><div class="row"><input id="lt" placeholder="O que não pode esquecer?" style="flex:2 1 200px"><input id="ld" type="date" value="${hoje()}"></div><button class="p" onclick="addLemb()">Adicionar lembrete</button></div>
  <h2>Lembretes</h2><div class="box">${l.length?l.map(r=>`<div class="li ${r.ok?'done':''}"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" ${r.ok?'checked':''} onchange="tog(${r.id})"><span>${esc(r.n)}</span></label><div><span class="tag ${!r.ok&&r.d&&r.d<hoje()?'late':''}">${r.d?fd(r.d):''}${!r.ok&&r.d&&r.d<hoje()?' · atrasado':''}</span><button class="x" aria-label="Apagar" onclick="del('lembs',${r.id})">✕</button></div></div>`).join(''):'<div class="empty">Nenhum lembrete.</div>'}</div>`;
}
function addLemb(){const n=$('#lt').value.trim();if(!n)return;S.lembs.push({id:id(),n,d:$('#ld').value,ok:false});save();render()}
function tog(i){const r=S.lembs.find(x=>x.id===i);r.ok=!r.ok;save();render()}
function del(k,i){S[k]=S[k].filter(x=>x.id!==i);save();render()}

function render(){
  $('#v').innerHTML=({resumo,lanc,metas,lemb})[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===tab));
  $('#mes').value=mes;
}
render();
</script>
</body>
</html>
